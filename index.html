<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>🎨 Ink Mixer | Точный расчёт чернил</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0a0f1c, #03050b);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      padding: 1.5rem;
      color: #eef2ff;
      min-height: 100vh;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,600;14..32,700&display=swap');

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    /* Карточки */
    .card {
      background: rgba(15, 25, 45, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 2rem;
      padding: 1.6rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 40px -14px rgba(0, 0, 0, 0.6);
    }

    /* Header */
    .hero {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .badge-icon {
      font-size: 3rem;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4));
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #c084fc, #60a5fa, #34d399);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }
    .sub {
      color: #9ca3af;
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }

    /* Форма */
    label {
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.4px;
      color: #cbd5e6;
      display: block;
      margin-bottom: 0.5rem;
    }

    input, select {
      width: 100%;
      padding: 0.9rem 1rem;
      background: #0f172f;
      border: 1.5px solid #1e2a4a;
      border-radius: 1.5rem;
      font-size: 1rem;
      color: #f1f5f9;
      font-weight: 500;
      transition: all 0.2s;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
      background: #111827;
    }

    .btn-primary {
      background: linear-gradient(105deg, #4f46e5, #7c3aed);
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 2rem;
      font-weight: 700;
      font-size: 1rem;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 14px -8px #4f46e580;
      margin-top: 0.8rem;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    /* Результат */
    .result-card {
      background: linear-gradient(125deg, #0f2a1f, #0a1a14);
      border-left: 4px solid #2dd4bf;
    }
    .solvent-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.9rem 0;
      border-bottom: 1px dashed rgba(45, 212, 191, 0.3);
    }
    .solvent-name {
      font-weight: 600;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .solvent-ml {
      font-size: 1.5rem;
      font-weight: 800;
      font-feature-settings: 'tnum';
    }
    .total-badge {
      background: #1e293b;
      padding: 0.8rem 1rem;
      border-radius: 1.2rem;
      margin-top: 0.8rem;
      display: flex;
      justify-content: space-between;
      font-weight: 600;
    }
    .copy-btn {
      background: #2d3748;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 2rem;
      color: white;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      justify-content: center;
      width: 100%;
      margin-top: 1rem;
      cursor: pointer;
      transition: 0.1s;
    }
    .history-item {
      background: rgba(255,255,240,0.05);
      border-radius: 1rem;
      padding: 0.6rem 1rem;
      margin-bottom: 0.6rem;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .empty-history {
      text-align: center;
      color: #6b7280;
      font-size: 0.8rem;
    }
    .glass-icon {
      font-size: 1.2rem;
    }
    footer {
      font-size: 0.7rem;
      text-align: center;
      color: #3b4259;
      margin-top: 1rem;
    }
    button {
      background: none;
      border: none;
    }
    .manufacturer-emoji {
      margin-right: 0.4rem;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="hero">
    <div class="badge-icon">🧪✨</div>
    <h1>Ink Mixer · Chroma</h1>
    <div class="sub">Точная формула для безупречной печати</div>
  </div>

  <!-- Основной калькулятор -->
  <div class="card">
    <label>📦 Вес чернил (граммы)</label>
    <input type="number" id="inkWeight" placeholder="Например: 850" value="" step="any">

    <label style="margin-top: 1rem;">🏭 Производитель</label>
    <select id="manufacturerSelect">
      <option value="0.267,0.75,0.25">🇷🇺 Санкемикалз (26.7%)</option>
      <option value="0.333,0.4,0.6">🎨 Сико (33.3%)</option>
      <option value="0.25,0.8,0.2">🇨🇳 Китай (25%)</option>
      <option value="0.221,0.333,0.667">🖨️ Тампо Механика (22.1%)</option>
    </select>

    <button class="btn-primary" id="calcBtn">
      <span>💧</span> РАССЧИТАТЬ РАСТВОРИТЕЛЬ
    </button>
  </div>

  <!-- Результат (пока скрыт) -->
  <div class="card result-card" id="resultCard" style="display: none;">
    <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.8rem;">
      <span>📐</span> <span style="font-weight: 700;">Пропорция замеса</span>
    </div>
    <div id="resultDynamic"></div>
    <button class="copy-btn" id="copyResultBtn">
      <span>📋</span> Скопировать рецепт
    </button>
  </div>

  <!-- История расчётов -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <span>⏳ <strong>История замесов</strong></span>
      <button id="clearHistoryBtn" style="background: #2d2f3e; padding: 0.3rem 0.9rem; border-radius: 2rem; color: #facc15; font-size: 0.7rem; cursor: pointer;">🗑 Очистить</button>
    </div>
    <div id="historyList">
      <div class="empty-history">📭 Нет расчётов. Нажмите «Рассчитать»</div>
    </div>
  </div>
  <footer>⏱️ Быстрый подбор CF2000 / CF3000 — экономия до 30% времени</footer>
</div>

<script>
  (function() {
    // --- Модель данных / история
    let calculationHistory = [];

    // Загрузка истории из localStorage
    function loadHistory() {
      const stored = localStorage.getItem("InkMixerHistory");
      if (stored) {
        try {
          calculationHistory = JSON.parse(stored);
        } catch(e) { console.warn(e); }
      }
      renderHistory();
    }

    function saveHistory() {
      localStorage.setItem("InkMixerHistory", JSON.stringify(calculationHistory.slice(0, 12))); // не больше 12
      renderHistory();
    }

    function addToHistory(weight, manufacturerName, cf2000, cf3000, totalMl) {
      const now = new Date();
      const timeStr = `${now.toLocaleDateString()} ${now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
      calculationHistory.unshift({
        id: Date.now(),
        weight: weight,
        manufacturer: manufacturerName,
        cf2000: cf2000,
        cf3000: cf3000,
        totalMl: totalMl,
        timestamp: timeStr
      });
      if (calculationHistory.length > 12) calculationHistory.pop();
      saveHistory();
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      if (!container) return;
      if (!calculationHistory.length) {
        container.innerHTML = '<div class="empty-history">📭 Нет расчётов. Нажмите «Рассчитать»</div>';
        return;
      }
      container.innerHTML = calculationHistory.map(item => `
        <div class="history-item">
          <div><strong>${item.weight}г</strong> · ${item.manufacturer}</div>
          <div style="font-size:0.75rem; background:#010e1c; padding: 0.2rem 0.6rem; border-radius: 2rem;">
            CF: ${item.cf2000}/${item.cf3000} мл
          </div>
        </div>
      `).join('');
    }

    function clearHistory() {
      calculationHistory = [];
      saveHistory();
    }

    // --- главная логика расчёта
    function calculateInk() {
      const weightInput = document.getElementById('inkWeight');
      let weight = parseFloat(weightInput.value);
      if (isNaN(weight) || weight <= 0) {
        alert("🎯 Укажите вес чернил в граммах (число больше 0)");
        return false;
      }
      // округлим до 1 знака для красоты
      weight = Math.round(weight * 10) / 10;

      const selectEl = document.getElementById('manufacturerSelect');
      const selectedOption = selectEl.options[selectEl.selectedIndex];
      const rawValue = selectEl.value;
      const manufacturerFull = selectedOption.text;
      const manufacturerName = manufacturerFull.split(' (')[0].replace(/^[🇷🇺🎨🇨🇳🖨️]\s*/, ''); // удаляем эмодзи-префикс

      const parts = rawValue.split(',');
      if (parts.length !== 3) return false;
      const solventPercent = parseFloat(parts[0]);
      const cf2000Ratio = parseFloat(parts[1]);
      const cf3000Ratio = parseFloat(parts[2]);

      const totalSolventMl = weight * solventPercent;
      const cf2000 = Math.round(totalSolventMl * cf2000Ratio);
      const cf3000 = Math.round(totalSolventMl * cf3000Ratio);
      const totalMl = cf2000 + cf3000;

      // отображение в resultCard
      const resultDiv = document.getElementById('resultDynamic');
      resultDiv.innerHTML = `
        <div class="solvent-line">
          <div class="solvent-name"><span>💧</span> CF2000 (быстрый)</div>
          <div class="solvent-ml">${cf2000} <span style="font-size:0.8rem;">мл</span></div>
        </div>
        <div class="solvent-line">
          <div class="solvent-name"><span>🌀</span> CF3000 (универсал)</div>
          <div class="solvent-ml">${cf3000} <span style="font-size:0.8rem;">мл</span></div>
        </div>
        <div class="total-badge">
          <span>🧪 Всего растворителя</span>
          <strong>${totalMl} мл</strong>
        </div>
        <div style="font-size:0.75rem; margin-top: 0.6rem; color:#b8e1dc;">
          📌 Рецепт для <strong>${weight}г</strong> чернил · ${manufacturerName}
        </div>
      `;
      document.getElementById('resultCard').style.display = 'block';
      window.scrollTo({ top: document.getElementById('resultCard').offsetTop - 20, behavior: 'smooth' });

      // добавить историю
      addToHistory(weight, manufacturerName, cf2000, cf3000, totalMl);
      
      // сохраняем последний вес в localStorage
      localStorage.setItem("lastInkWeight", weight);
      return { cf2000, cf3000, totalMl, manufacturerName, weight };
    }

    // копирование результатов
    function copyCurrentResult() {
      const weightInput = document.getElementById('inkWeight');
      let weight = parseFloat(weightInput.value);
      if (isNaN(weight) || weight <= 0) {
        alert("Сначала рассчитайте состав");
        return;
      }
      const selectEl = document.getElementById('manufacturerSelect');
      const manufacturerFull = selectEl.options[selectEl.selectedIndex].text;
      const rawValue = selectEl.value;
      const parts = rawValue.split(',');
      const solventPercent = parseFloat(parts[0]);
      const cf2000Ratio = parseFloat(parts[1]);
      const cf3000Ratio = parseFloat(parts[2]);
      const totalSolventMl = weight * solventPercent;
      const cf2000 = Math.round(totalSolventMl * cf2000Ratio);
      const cf3000 = Math.round(totalSolventMl * cf3000Ratio);
      const totalMl = cf2000 + cf3000;
      
      const copyText = `🧴 Рецепт: ${weight}г чернил → CF2000: ${cf2000} мл, CF3000: ${cf3000} мл (всего ${totalMl} мл)`;
      navigator.clipboard.writeText(copyText).then(() => {
        const btn = document.getElementById('copyResultBtn');
        const original = btn.innerHTML;
        btn.innerHTML = '<span>✅</span> Скопировано!';
        setTimeout(() => { btn.innerHTML = original; }, 1500);
      }).catch(() => alert("Не удалось скопировать"));
    }

    // восстановление сохранённого веса
    function restoreLastWeight() {
      const lastWeight = localStorage.getItem("lastInkWeight");
      if (lastWeight && !isNaN(parseFloat(lastWeight))) {
        document.getElementById('inkWeight').value = parseFloat(lastWeight);
      }
    }

    // инициализация событий
    document.addEventListener('DOMContentLoaded', () => {
      loadHistory();
      restoreLastWeight();

      const calcButton = document.getElementById('calcBtn');
      if (calcButton) calcButton.addEventListener('click', calculateInk);

      const copyBtn = document.getElementById('copyResultBtn');
      if (copyBtn) copyBtn.addEventListener('click', copyCurrentResult);

      const clearBtn = document.getElementById('clearHistoryBtn');
      if (clearBtn) clearBtn.addEventListener('click', () => {
        if (confirm("Удалить всю историю расчётов?")) {
          clearHistory();
        }
      });

      // если пользователь нажмет Enter в поле веса
      const weightField = document.getElementById('inkWeight');
      if (weightField) {
        weightField.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') calculateInk();
        });
      }
    });
  })();
</script>
</body>
</html>
